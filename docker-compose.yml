# Port map (host → container)
# ─────────────────────────────────────────────
# Postgres   5435:5432   (DMS uses 5434)
# Redis      6382:6379   (DMS uses 6381)
# Qdrant     7014:6333   (DMS uses 7004)
# Backend    8001:8000   (DMS uses 7001)
# Worker     (no host port — internal only)
# Frontend   8002:7002   (DMS uses 7002)
# Superadmin 8003:7003   (DMS uses 7003)
# ─────────────────────────────────────────────

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: mizan
      POSTGRES_USER: mizan
      POSTGRES_PASSWORD: mizan
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5435:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mizan -d mizan"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "7014:6333"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/6333'"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    user: "0"
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8001:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mizan:mizan@db:5432/mizan
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
      ALLOWED_ORIGINS: '["http://localhost:8002","http://localhost:8003"]'
    volumes:
      - ./backend:/app
      - uploads:/tmp/mizan-uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_started

  worker:
    build: ./backend
    user: "0"
    command: celery -A app.worker.celery_app worker -l info
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://mizan:mizan@db:5432/mizan
      REDIS_URL: redis://redis:6379/0
      QDRANT_URL: http://qdrant:6333
    volumes:
      - ./backend:/app
      - uploads:/tmp/mizan-uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8002:7002"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8001/api/v1

  superadmin:
    build:
      context: ./superadmin
      dockerfile: Dockerfile
    ports:
      - "8003:7003"
    volumes:
      - ./superadmin:/app
      - superadmin_node_modules:/app/node_modules
    environment:
      VITE_API_URL: http://localhost:8001/api/v1

volumes:
  pg-data:
  qdrant-data:
  uploads:
  frontend_node_modules:
  superadmin_node_modules:
